[00 - Master]

## Completely enable/disable VBNetTweaks mod [Synced with Server]
# Setting type: Boolean
# Default value: true
ModEnabled = true

[02 - Modules]

## Steam socket optimizations [Synced with Server]
# Setting type: Boolean
# Default value: true
SteamOptimizations = true

## Optimization ZDO sender [Synced with Server]
# Setting type: Boolean
# Default value: true
ZDOOptimization = true

## On ship synchronization [Synced with Server]
# Setting type: Boolean
# Default value: true
ShipSync = true

## Optimizing the movement of players and mobs [Synced with Server]
# Setting type: Boolean
# Default value: true
ZSyncTransformOptimization = true

## Enable smooth player markers on map
## Improves display of player positions [Synced with Server]
# Setting type: Boolean
# Default value: true
MapPositionSync = true

[03 - Client Steam Settings]

## Maximum Steam send rate (vanilla = 150 KB/s) [Synced with Server]
# Setting type: Int32
# Default value: 2048
MaxRateKB = 4096

## Steam send buffer size in KB (vanilla = ~260KB). Recommended 1024-4096 [Synced with Server]
# Setting type: Int32
# Default value: 2048
SendBufferSizeKB = 2048

## Steam connection timeout (milliseconds)
## If connection is idle longer than this — it will be closed
## vanilla: 30000 (30 sec), recommended: 60000-180000 [Synced with Server]
# Setting type: Single
# Default value: 120000
TimeoutConnected = 120000

## Steam Keep-Alive interval (milliseconds)
## How often to send ping to keep connection alive
## vanilla: 30000 (30 sec), recommended: 15000-60000 [Synced with Server]
# Setting type: Single
# Default value: 30000
TimeoutKeepalive = 30000

## Maximum Steam receive message size (megabytes)
## Large packets will be rejected
## vanilla: ~1-2 MB, recommended: 4-16 MB [Synced with Server]
# Setting type: Int32
# Default value: 8
RecvMaxMessageSize = 8

[04 - Client ZDO Settings]

## ZDO packet send buffer size (vanilla = 10240 bytes) [Synced with Server]
# Setting type: Int32
# Default value: 10240
ZDOQueueLimit = 10240

[05 - Transform Settings]

## Position smoothing value (vanilla: 0.20) [Synced with Server]
# Setting type: Single
# Default value: 0.1
SmoothPosition = 0.1

## Rotation smoothing value (vanilla: 0.50) [Synced with Server]
# Setting type: Single
# Default value: 0.3
SmoothRotation = 0.3

## Micro-movement threshold (vanilla: 0.001) [Synced with Server]
# Setting type: Single
# Default value: 0.002
MicroThreshold = 0.002

## Client distance threshold (vanilla: 0.01) [Synced with Server]
# Setting type: Single
# Default value: 0.005
ClientDistanceThreshold = 0.005

## Distance threshold for instant teleport (meters)
## If object moves beyond this value — teleport without smoothing
## vanilla: 5, recommended: 5-20 [Synced with Server]
# Setting type: Single
# Default value: 3
TeleportDistanceThreshold = 3

## Angle threshold for instant rotation teleport (degrees)
## If object rotates beyond this value — teleport without smoothing
## vanilla: 45, recommended: 30-90 [Synced with Server]
# Setting type: Single
# Default value: 35
TeleportRotationThreshold = 35

[06 - Server Steam Settings]

## Maximum Steam send rate (vanilla = 150 KB/s) [Not Synced with Server]
# Setting type: Int32
# Default value: 4096
MaxRateKB = 4096

## Steam send buffer size in KB (vanilla = ~260KB). Recommended 1024-4096 [Not Synced with Server]
# Setting type: Int32
# Default value: 4096
SendBufferSizeKB = 4096

[07 - Server ZDO Settings]

## Data send interval (vanilla = 0.05) [Not Synced with Server]
# Setting type: Single
# Default value: 0.02
SendInterval = 0.03

## Peers per update (vanilla = 1). Better set equal to max server slots. [Not Synced with Server]
# Setting type: Int32
# Default value: 10
PeersPerUpdate = 30

## ZDO packet send buffer size (vanilla = 10240 bytes) [Not Synced with Server]
# Setting type: Int32
# Default value: 20480
ZDOQueueLimit = 20480

## Percentage of ZDOQueueLimit for flush activation (0.0-1.0)
## 0.1 = rare flush (traffic saving, but delays)
## 0.3 = optimal balance (recommended)
## 0.5 = frequent flush (less delays, more traffic) [Not Synced with Server]
# Setting type: Single
# Default value: 0.2
FlushThresholdPercent = 0.2

[08 - Map Positions]

## Player position send interval (sec)
## Lower = smoother, but more traffic
## vanilla: 2.0, recommended: 0.2-0.5 [Synced with Server]
# Setting type: Single
# Default value: 0.5
SendInterval = 0.5

## Marker interpolation delay (sec)
## Markers will lag by this value for smoothness [Synced with Server]
# Setting type: Single
# Default value: 0.1
InterpolationDelay = 0.1

## Maximum movement prediction speed (m/s)
## Limits jerks during extrapolation [Synced with Server]
# Setting type: Single
# Default value: 40
MaxPredictionSpeed = 40

## Maximum movement prediction time (sec)
## How long marker moves by inertia [Synced with Server]
# Setting type: Single
# Default value: 0.05
MaxPredictionTime = 0.05

## Teleport threshold for markers (meters)
## If player moves beyond — marker jumps instantly [Synced with Server]
# Setting type: Single
# Default value: 50
TeleportThreshold = 50

