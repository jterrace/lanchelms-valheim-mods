## Smoke can choke fires. Set false so fireplaces are never reported as blocked by their own smoke, smelters, kilns and blast furnaces never stall on smoke, and spreading fires are never put out by it. Spreading fires still expire after 30 seconds and still die in the rain.
# Setting type: Boolean
# Default value: true
SmokeSuffocation = true

