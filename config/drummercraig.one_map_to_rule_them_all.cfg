## Settings file was created by plugin One Map To Rule Them All v1.2.1
## Plugin GUID: drummercraig.one_map_to_rule_them_all

[Client]

## Set to true to reset ALL client settings to their default values. Resets itself to false automatically.
# Setting type: Boolean
# Default value: false
ResetToDefaults = false

## Show map pins created by other players on your minimap.
# Setting type: Boolean
# Default value: true
ShowOtherPlayerPins = true

## How often (seconds) batched exploration cells are sent to the server. Range: 0.1–5.0.
# Setting type: Single
# Default value: 1
ExploreFlushInterval = 5

## How often (seconds) proximity and radar watchers check for nearby objects. Range: 0.05–1.0.
# Setting type: Single
# Default value: 0.25
UpdateThrottleInterval = 1.0

## How often (seconds) discovery pin icons are reapplied after Valheim's per-frame icon reset. 0 = every frame (maximum fidelity). 0.05 = 20 Hz (default, imperceptible). Increase to 0.5–1.0 on low-end hardware. Range: 0–1.0.
# Setting type: Single
# Default value: 0.05
DiscoveryIconInterval = 1.0

## Minimum time (seconds) before re-running the nearby-object Physics query for an already-discovered pin. Prevents redundant OverlapSphere calls when the player oscillates near a detection boundary. Higher values reduce Physics overhead; lower values keep resource counts fresher. Range: 1–120.
# Setting type: Single
# Default value: 10

QuantityRecountInterval = 30

## Replace the standard pin icon on discovery pins with the item sprite from ObjectDB. Client-only — does not affect other players.
# Setting type: Boolean
# Default value: true
DiscoveryPinObjectIcon = true

## Show the abbreviation label on auto-discovery pins. Set to false to show only the pin icon. Client-only — does not affect other players.
# Setting type: Boolean
# Default value: true
DiscoveryPinText = true

## Show the abbreviation label on radar pins. Set to false to show the item icon only.
# Setting type: Boolean
# Default value: false
RadarPinText = false

## Radius in meters within which nearby critter radar pins are merged into a single pin with a count label. Set to 0 for one pin per critter (no clustering). Range: 0–150. This is client-side and independent of the server ClusterRadius setting.
# Setting type: Single
# Default value: 16
RadarCritterClusterRadius = 16

